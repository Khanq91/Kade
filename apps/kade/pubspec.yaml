name: kade
description: Kade — lịch âm/dương Việt Nam (web + Android).
publish_to: none
version: 1.0.0+2
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  lunar_core: any
  calendar_data: any
  flutter_riverpod: ^3.4.3
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  http: ^1.6.0
  go_router: ^18.0.1
  flutter_localizations:
    sdk: flutter
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.6.0
  file_picker: ^12.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  googleapis: ^17.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  home_widget: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.1
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/overrides.json
