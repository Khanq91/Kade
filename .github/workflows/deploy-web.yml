# Build Flutter web + Android trên mọi branch push; deploy web lên GitHub Pages
# chỉ khi push vào main (plan §6 bước 15, D033/D034).
# User cần làm một lần (docs/setup-google.md phần C): Settings → Pages →
# Source = GitHub Actions; 2 secrets KADE_CONFIG_URL, KADE_WEB_CLIENT_ID;
# thêm origin https://<user>.github.io vào OAuth client Web.
name: build-and-deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.5"
          channel: stable
          cache: true

      # Workspace root resolve toàn bộ packages/* + apps/* (AGENTS §5).
      - run: dart pub get

      # Generated *.g.dart / *.freezed.dart bị gitignore (E014).
      - run: dart run build_runner build
        working-directory: apps/kade

      - run: flutter test --timeout 90s
        working-directory: apps/kade

      # base-href = /<tên repo>/ (site https://<user>.github.io/<repo>/).
      # Dùng custom domain → đổi thành "/". Secrets trống → app vẫn chạy, tắt
      # tính năng tương ứng (AGENTS §7).
      - name: Build web
        working-directory: apps/kade
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=KADE_CONFIG_URL=${{ secrets.KADE_CONFIG_URL }}
          --dart-define=KADE_WEB_CLIENT_ID=${{ secrets.KADE_WEB_CLIENT_ID }}

      # Privacy policy cho Play listing (bước 18): flutter build web không copy
      # file lạ trong web/ nên chép thủ công → https://<user>.github.io/<repo>/privacy.html
      - run: cp docs/privacy.html apps/kade/build/web/privacy.html

      # Build Android on every push too. This is a debug APK for CI validation;
      # signed release APK/AAB remains in release-android.yml on tags v*.
      - name: Build Android debug APK
        working-directory: apps/kade
        run: >
          flutter build apk --debug
          --dart-define=KADE_CONFIG_URL=${{ secrets.KADE_CONFIG_URL }}
          --dart-define=KADE_WEB_CLIENT_ID=${{ secrets.KADE_WEB_CLIENT_ID }}

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kade-debug-apk-${{ github.sha }}
          path: apps/kade/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/kade/build/web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # "Failed to get ID Token: Request timeout" là OIDC phía GitHub lúc quá
      # tải (E020), không phải thiếu quyền → thử lại đúng một lần.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
