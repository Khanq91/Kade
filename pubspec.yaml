# Workspace root — Kade monorepo (Dart pub workspaces).
# Không phải package chạy được; chỉ gom resolution cho packages/* và apps/*.
# App Flutter nằm ở apps/kade (tạo ở Phase 1), engine ở packages/lunar_core.
name: kade_workspace
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/*
  # - apps/*   # bật khi apps/kade tồn tại: pub lỗi nếu glob không khớp package nào (ERRORS E004)
